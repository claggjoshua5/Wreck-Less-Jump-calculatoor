name: Android APK CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Free runner disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force || true
          df -h /

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Prebuild Android
        working-directory: frontend
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Cache Gradle native outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            frontend/android/.gradle
            frontend/android/app/.cxx
            frontend/android/app/build/intermediates/cmake
            frontend/android/app/build/intermediates/cxx
          key: ${{ runner.os }}-android-${{ hashFiles('frontend/package-lock.json', 'frontend/android/build.gradle', 'frontend/android/app/build.gradle', 'frontend/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-android-

      - name: Ensure gradlew is executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: frontend/android
        timeout-minutes: 45
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" -Dorg.gradle.daemon=false
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --build-cache \
            -x test \
            -x lint \
            --no-watch-fs \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.caching=true \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Build release APK
        working-directory: frontend/android
        timeout-minutes: 45
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" -Dorg.gradle.daemon=false
        run: |
          ./gradlew assembleRelease \
            --stacktrace \
            --build-cache \
            -x test \
            -x lint \
            --no-watch-fs \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.caching=true \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: List APK outputs
        if: always()
        run: find frontend/android -name "*.apk" -type f

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: wreckless-jump-calculator-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: wreckless-jump-calculator-release-apk
          path: frontend/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
