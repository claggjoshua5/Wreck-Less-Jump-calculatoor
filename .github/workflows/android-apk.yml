name: Android APK CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          echo "Disk usage before cleanup:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost
          sudo docker image prune --all --force || true
          echo "Disk usage after cleanup:"
          df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Prebuild Android
        # The withAbiFilters config plugin (frontend/plugins/withAbiFilters.js)
        # injects ndk { abiFilters "arm64-v8a" } into app/build.gradle here.
        # This keeps the ABI restriction in source rather than patching files
        # post-hoc. For release builds, update the plugin options to include
        # all required ABIs or remove the plugin entirely.
        working-directory: frontend
        run: CI=1 npx expo prebuild --platform android --no-install

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Cache Gradle and NDK build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            frontend/android/.gradle
            # Cache compiled C++ objects so react-native-reanimated/worklets
            # native compilation is skipped on cache hits, dramatically
            # reducing build time on subsequent runs.
            frontend/android/app/.cxx
            frontend/android/app/build/intermediates/cmake
            frontend/android/app/build/intermediates/cxx
          key: ${{ runner.os }}-gradle-ndk-${{ hashFiles('frontend/android/gradle/wrapper/gradle-wrapper.properties', 'frontend/android/build.gradle', 'frontend/android/app/build.gradle', 'frontend/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-ndk-
            ${{ runner.os }}-gradle-

      - name: Ensure gradlew is executable
        working-directory: frontend/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        # 60 minutes: cold C++ build for a single ABI (arm64-v8a) typically
        # takes 12-18 minutes on GitHub runners. 60 min gives ample headroom.
        # ABI is restricted to arm64-v8a via the withAbiFilters config plugin
        # applied during prebuild — this is a debug/CI build only constraint.
        timeout-minutes: 60
        working-directory: frontend/android
        env:
          # 3072m heap: leaves ~4GB headroom for OS + parallel workers on a
          # ~7GB runner. G1GC reduces pause times under memory pressure.
          GRADLE_OPTS: '-Dorg.gradle.jvmargs="-Xmx3072m -XX:MaxMetaspaceSize=512m -XX:+UseG1GC" -Dorg.gradle.daemon=false'
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --build-cache \
            -x test \
            -x lint \
            --no-watch-fs \
            -Dorg.gradle.parallel=true \
            -Dorg.gradle.workers.max=4 \
            -Dorg.gradle.caching=true \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Debug - List all APK files
        if: always()
        run: find . -name "*.apk" -type f

      - name: Debug - List build outputs directory
        if: always()
        run: ls -la **/build/outputs/apk/debug/ || echo "Directory not found"

      - name: Upload APK artifact(s)
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
